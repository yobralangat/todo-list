<!doctype html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Todo List</title><script defer="defer" src="main.js"></script></head><body><div id="app-container"><aside id="sidebar"><h2>Projects</h2><ul id="project-list"></ul><button id="add-project-btn">+ Add Project</button><div id="project-form-container" class="hidden"><input id="new-project-name" placeholder="Project Name"> <button id="save-project-btn">Save</button> <button id="cancel-project-btn">Cancel</button></div></aside><main id="main-content"><h1 id="active-project-title">Default</h1><button id="add-todo-btn">+ Add Task</button><div id="todo-list"></div></main></div><div id="task-modal" class="modal hidden"><div class="modal-content"><h2>Add New Task</h2><form action="" id="task-form"><label for="task-title">Title:</label> <input id="task-title" required> <label for="task-desc">Description:</label> <textarea id="task-desc" rows="3"></textarea> <label for="task-due">Due Date:</label> <input type="date" id="task-due" required> <label for="task-priority">Priority:</label> <select name="" id="task-priority"><option value="low">Low</option><option value="medium" selected="selected">Medium</option><option value="high">High</option></select><div class="form-buttons"><button type="submit" id="save-task-btn">Save Task</button> <button type="button" id="close-modal-btn">Cancel</button></div></form></div></div></body></html>
